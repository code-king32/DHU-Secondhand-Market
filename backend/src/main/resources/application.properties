spring.application.name=secondhand

# HTTP 与会话：开发/验收统一 8080；生产 Secure Cookie 在 prod 配置启用。
server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.forward-headers-strategy=none

# 浏览器来源及代理：名单中的代理才可提供限流所用的 X-Forwarded-For。
app.web.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
app.web.trusted-proxies=

# 图片：路径相对于后端启动目录，部署时使用持久化目录。
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.images.directory=uploads/images
app.images.max-per-user=100
app.images.max-bytes-per-user=104857600
app.images.unused-retention-hours=24
app.images.cleanup-delay-ms=3600000

# 幂等创建邮件任务、图片归属与引用表；不改变已有业务表。
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/runtime-schema.sql

# 后台任务及邮件：密钥与数据库、图片目录一起保留。
app.jobs.enabled=true
app.mail.key-file=uploads/mail-code.key
app.mail.max-attempts=3
app.mail.retry-delay-seconds=15
app.mail.poll-delay-ms=5000

# 单实例进程内限流；时间窗口为秒，邮件日额度按滚动 24 小时计算。
app.abuse.enabled=true
app.abuse.login-ip-limit=30
app.abuse.login-account-limit=5
app.abuse.login-window-seconds=600
app.abuse.mail-ip-hour-limit=20
app.abuse.mail-ip-day-limit=100
app.abuse.mail-email-day-limit=10
app.abuse.mail-global-day-limit=1000
