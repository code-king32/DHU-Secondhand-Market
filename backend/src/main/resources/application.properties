spring.application.name=secondhand
server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# 图片目录相对于后端启动目录；上传文件不提交到 Git。
app.images.directory=uploads/images
# 幂等创建邮件任务、图片归属与引用表；不改变已有业务表。
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/runtime-schema.sql
app.mail.key-file=uploads/mail-code.key
app.mail.max-attempts=3
app.mail.retry-delay-seconds=15
app.images.max-per-user=100
app.images.max-bytes-per-user=104857600
app.images.unused-retention-hours=24
app.abuse.enabled=true
app.abuse.login-ip-limit=30
app.abuse.login-account-limit=5
app.abuse.login-window-seconds=600
app.abuse.mail-ip-hour-limit=20
app.abuse.mail-ip-day-limit=100
app.abuse.mail-email-day-limit=10
app.abuse.mail-global-day-limit=1000
