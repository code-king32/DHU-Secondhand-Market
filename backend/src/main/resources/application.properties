spring.application.name=secondhand

# HTTP 与会话：开发/验收统一 8080；生产 Secure Cookie 在 prod 配置启用。
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.forward-headers-strategy=none

# 连接池：生产环境可通过环境变量按数据库规格调整。
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:2000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}

# 小型 JSON 响应启用压缩，降低列表和社区接口的网络开销。
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/html,text/css,application/javascript
server.compression.min-response-size=1024

# 整数标识和状态不接受小数截断；一个请求体只允许一个 JSON 文档。
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-trailing-tokens=true

# 浏览器来源及代理：名单中的代理才可提供限流所用的 X-Forwarded-For。
app.web.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
app.web.trusted-proxies=
app.web.max-json-bytes=65536

# 图片：路径相对于后端启动目录，部署时使用持久化目录。
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.images.directory=uploads/images
app.images.max-concurrent-decodes=2
app.images.max-per-user=100
app.images.max-bytes-per-user=104857600
app.images.unused-retention-hours=24
app.images.cleanup-delay-ms=3600000
app.images.cleanup-batch-size=200

# 幂等创建邮件任务、图片归属与引用表；不改变已有业务表。
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/runtime-schema.sql

# 后台任务及邮件：密钥与数据库、图片目录一起保留。
app.jobs.enabled=true
app.jobs.monitor-delay-ms=3600000
app.mail.key-file=uploads/mail-code.key
app.mail.max-attempts=3
app.mail.retry-delay-seconds=15
app.mail.poll-delay-ms=5000
app.mail.batch-size=20

# 后台任务默认保持单线程，避免重复清理；高吞吐部署可按数据库和 SMTP 能力调大。
app.jobs.mail-pool-size=1
app.jobs.maintenance-pool-size=1

# 单实例进程内限流；窗口从该计数首次请求起算，邮件日额度使用固定 24 小时窗口。
app.abuse.enabled=true
app.abuse.login-ip-limit=30
app.abuse.login-account-limit=5
app.abuse.login-window-seconds=600
app.abuse.mail-ip-hour-limit=20
app.abuse.mail-ip-day-limit=100
app.abuse.mail-email-day-limit=10
app.abuse.mail-global-day-limit=1000
